name: Validate pull request

on:
  pull_request:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to validate (leave empty for the selected branch)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: validate-pr-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.pr_number && format('refs/pull/{0}/merge', inputs.pr_number) || github.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          package-manager-cache: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enable corepack
        run: corepack enable

      - name: Activate pnpm
        run: corepack prepare pnpm@9.0.0 --activate

      - name: Check plugin versions
        run: node scripts/check-version.mjs

      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Build plugin
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm build
