name: Build and Release Non-Steam Badges

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          package-manager-cache: false

      - name: Check plugin versions
        run: node scripts/check-version.mjs

      - name: Enable corepack
        run: corepack enable

      - name: Activate pnpm
        run: corepack prepare pnpm@9.0.0 --activate

      - name: Show tool versions
        run: |
          node --version
          pnpm --version

      - run: pnpm install --frozen-lockfile

      - name: Stage plugin content
        run: bash scripts/build-plugin-content.sh

      - name: Build plugin bundles
        run: |
          bash scripts/build-plugin-zip.sh
          bash scripts/build-plugin-tar.sh

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: decky-nonsteam-badges
          path: |
            decky-nonsteam-badges.zip
            decky-nonsteam-badges.tar.gz

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: decky-nonsteam-badges
          path: .

      - name: Create a release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "decky-nonsteam-badges.zip,decky-nonsteam-badges.tar.gz"
          generateReleaseNotes: true
          allowUpdates: true
          replacesArtifacts: true
